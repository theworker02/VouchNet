[build]
  command = "node packages/db/scripts/migrate-if-configured.mjs && node apps/web/scripts/register-stripe-payment-domain.mjs --if-configured && pnpm build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.19.0"
  PNPM_FLAGS = "--shamefully-hoist"
  # These values are deployment configuration, not credentials. Keeping them
  # out of value-based scanning avoids false positives from public product text.
  # VOUCHNET_OAUTH_ISSUER is a public identifier/URL, not a signing secret.
  # SESSION_SECRET, VOUCHNET_OAUTH_SIGNING_KEY, RESEND_API_KEY, DATABASE_URL,
  # and REDIS_URL stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM,NEXUS_ENV,APP_URL,VOUCHNET_OAUTH_ISSUER"

# Secrets belong in Netlify's environment-variable settings, never in this file.

[functions]
  directory = "netlify/functions"

[functions."expire-unclaimed-organization-invites"]
  # Weekdays at 15:00 UTC. Scheduled Functions only run on production deploys.
  schedule = "0 15 * * 1-5"
