packages:
  - apps/*
  - packages/*

# Required by Next.js/Vitest tooling; kept explicit so dependency lifecycle scripts are reviewed.
onlyBuiltDependencies:
  - argon2
  - esbuild
  - unrs-resolver
allowBuilds:
  argon2: true
  esbuild: true
  unrs-resolver: true

# Security: patched source-map-js (GHSA-68fv-2mgg-jv7q) pulled in via next > postcss.
overrides:
  source-map-js: '>=1.2.2'
