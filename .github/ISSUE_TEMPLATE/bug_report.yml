name: Bug report
description: Report a reproducible problem in VouchNet.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve VouchNet. Do not include passwords, API keys, session cookies,
        private messages, resumes, or other sensitive personal information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact in a few clear sentences.
      placeholder: The job-posting form rejects a valid compensation range.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps.
      placeholder: |
        1. Sign in with a test account
        2. Open /jobs/post
        3. Submit the form with …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      options:
        - Public website
        - Signed-in web application
        - Mobile browser
        - API or integration
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Safe supporting details
      description: Add redacted screenshots, a public error message, or relevant logs. Remove all secrets and personal data first.
