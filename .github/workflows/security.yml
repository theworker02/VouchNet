name: Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  runtime-dependency-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact pnpm version is pinned once in package.json (packageManager).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # This job gates dependencies that can ship with the application. Install scripts remain
      # disabled because no package lifecycle code needs to run for an audit-only verification.
      - run: pnpm install --frozen-lockfile --prod --ignore-scripts
      - run: pnpm audit --prod --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
