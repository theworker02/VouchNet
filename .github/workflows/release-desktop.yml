name: Release VouchNet Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Windows installer
        run: pnpm --filter @vouchnet/desktop bundle
      - name: Stage release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'apps/desktop/src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          if ($null -eq $setup -or $null -eq $msi) { throw 'Expected NSIS and MSI desktop artifacts were not produced.' }
          $setupName = "VouchNetSetup-$version-x64.exe"
          $msiName = "VouchNet-$version-x64.msi"
          $checksumName = "VouchNet-$version-x64.sha256"
          Copy-Item $setup.FullName "release-assets/$setupName"
          Copy-Item $msi.FullName "release-assets/$msiName"
          @(
            "$((Get-FileHash "release-assets/$setupName" -Algorithm SHA256).Hash.ToLower())  $setupName"
            "$((Get-FileHash "release-assets/$msiName" -Algorithm SHA256).Hash.ToLower())  $msiName"
          ) | Set-Content "release-assets/$checksumName"
      - name: Load release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/releases/v$version.md"
          if (-not (Test-Path $notes)) { throw "Missing release notes: $notes" }
          Copy-Item $notes release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: vouchnet-desktop-windows-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
